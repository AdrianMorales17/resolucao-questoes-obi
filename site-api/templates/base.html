<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <title>
        {% block titulo %}
        {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
            <div class="container px-1">

                <a class="navbar-brand" href="{{ url_for('home') }}">
                    Projeto APIs
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    
                    <ul class="navbar-nav ms-auto">
                        
                        <li class="nav-item">
                            <a class="nav-link px-3" href="{{ url_for('home') }}">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link px-3" href="{{ url_for('pagina_pokemon') }}">Pokemon</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link px-3" href="{{ url_for('pagina_paises') }}">Paises</a>
                        </li>
                    </ul>            

                </div>
            </div>
        </nav>
    </header>

    <main class="container d-flex justify-content-center align-items-center mt-5">

        <div class="card shadow p-4 w-100" style="max-width: 700px;">

            {% block conteudo %}
            {% endblock %}

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
